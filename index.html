<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Course Tracker Dashboard</title>
<style>
/* ------------------ BASE ------------------ */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
body {
    background: #F5F6FA;
    color: #2F3A4B;
    padding: 30px;
    transition: background 0.3s, color 0.3s;
}
body.dark-mode {
    background: #1E1E2F;
    color: #E0E0E0;
}

/* ------------------ HEADER ------------------ */
h1 {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 20px;
}

/* ------------------ FORM ------------------ */
form#courseForm {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    padding: 25px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    margin-bottom: 25px;
    transition: all 0.3s;
}
body.dark-mode form#courseForm { background: #2A2A3D; }

form input, form select, form textarea {
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #D1D5DB;
    font-size: 0.95rem;
    transition: border 0.2s, box-shadow 0.2s;
}
form input:focus, form select:focus, form textarea:focus {
    border-color: #4A90E2;
    box-shadow: 0 0 8px rgba(74,144,226,0.3);
    outline: none;
}
body.dark-mode form input, body.dark-mode form select, body.dark-mode form textarea {
    background: #3A3A4D;
    border: 1px solid #555;
    color: #E0E0E0;
}

form button {
    grid-column: span 2;
    padding: 12px 20px;
    background-color: #4A90E2;
    color: #ffffff;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
}
form button:hover {
    background-color: #357ABD;
    transform: translateY(-2px);
}

/* ------------------ TOP CONTROLS ------------------ */
.top-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    align-items: center;
}
.top-controls input, .top-controls select {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #D1D5DB;
}
body.dark-mode .top-controls input, body.dark-mode .top-controls select {
    background: #3A3A4D;
    color: #E0E0E0;
    border: 1px solid #555;
}

.top-controls button.dark-mode-toggle {
    margin-left: auto;
    background-color: #4A90E2;
    color: #ffffff;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}
.top-controls button.dark-mode-toggle:hover {
    background-color: #357ABD;
    transform: translateY(-2px);
}

/* ------------------ TABLE ------------------ */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}
table#courseTable {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
    background: #ffffff;
    transition: all 0.3s ease;
    min-width: 1500px;
}
body.dark-mode table#courseTable { background: #2A2A3D; }

table th, table td {
    padding: 12px 10px;
    text-align: left;
    font-size: 0.9rem;
    vertical-align: top;
}
table th {
    background: #2F3A4B;
    color: #F1F2F6;
    position: sticky;
    top: 0;
    z-index: 1;
}
body.dark-mode table th { background: #3A3A4D; color: #E0E0E0; }

table tr { transition: all 0.2s ease; }
table tr:hover { background-color: #F0F4FF; }
body.dark-mode table tr:hover { background-color: #3F3F55; }

tr.completed { background-color: #D1F7D6; }
tr.ongoing { background-color: #FFF4CC; }
tr.upcoming { background-color: #E2E3E5; }
body.dark-mode tr.completed { background-color: #28A74533; }
body.dark-mode tr.ongoing { background-color: #FFC10733; }
body.dark-mode tr.upcoming { background-color: #6C757D33; }

/* ------------------ PROGRESS BAR ------------------ */
.progress-bar-container {
    background: #E5E5E5;
    border-radius: 8px;
    overflow: hidden;
    min-width: 90px;
}
body.dark-mode .progress-bar-container { background: #555; }

.progress-bar {
    height: 10px;
    background-color: #4A90E2;
    transition: width 0.5s ease;
}
body.dark-mode .progress-bar { background-color: #357ABD; border-radius: 8px; }

/* ------------------ ANALYTICS ------------------ */
#analytics {
    margin-top: 20px;
    font-size: 1rem;
    padding: 15px 20px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}
body.dark-mode #analytics { background: #2A2A3D; }

/* ------------------ CSV / IMPORT BUTTONS ------------------ */
#exportCSV, #importCSV {
    margin-top: 10px;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
    border: none;
    background-color: #4A90E2;
    color: #ffffff;
    transition: all 0.3s ease;
}
#exportCSV:hover, #importCSV:hover {
    transform: translateY(-2px);
    background-color: #357ABD;
}

.action-btn {
    padding: 7px 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    margin: 2px;
}
.edit-btn { background: #4A90E2; color: white; }
.delete-btn { background: #E74C3C; color: white; }
.status-msg {
    margin: 12px 0 18px;
    font-weight: 600;
    color: #357ABD;
}
body.dark-mode .status-msg { color: #8AB4F8; }
</style>
</head>
<body>

<h1>Advanced Course Tracker Dashboard</h1>
<p id="statusMessage" class="status-msg">Loading courses from Firebase...</p>

<div class="top-controls">
    <input type="text" id="search" placeholder="Search by Name, University, Category...">
    <select id="filterStatus">
        <option value="">All Status</option>
        <option value="Completed">Completed</option>
        <option value="Ongoing">Ongoing</option>
        <option value="Upcoming">Upcoming</option>
    </select>
    <select id="filterCertificate">
        <option value="">All Certificates</option>
        <option value="Yes">With Certificate</option>
        <option value="No">Without Certificate</option>
    </select>
    <select id="sortBy">
        <option value="">Sort By</option>
        <option value="startDate">Start Date</option>
        <option value="completeDate">Completion Date</option>
        <option value="rating">Rating</option>
        <option value="hours">Course Hours</option>
    </select>
    <button id="darkModeToggle" class="dark-mode-toggle">Toggle Dark Mode</button>
</div>

<form id="courseForm">
    <input type="text" id="serial" placeholder="Serial" required>
    <input type="text" id="name" placeholder="Course Name" required>
    <input type="url" id="weblink" placeholder="Course Link" required>
    <select id="certificate"><option value="Yes">Yes</option><option value="No">No</option></select>
    <input type="number" id="hours" placeholder="Course Hours" required>
    <input type="text" id="university" placeholder="University / Platform" required>
    <input type="date" id="startDate" required>
    <input type="date" id="completeDate" required>
    <input type="number" id="rating" placeholder="Rating 0-5" min="0" max="5" step="0.1">
    <input type="text" id="category" placeholder="Category / Skill">
    <input type="text" id="instructor" placeholder="Instructor Name">
    <input type="text" id="price" placeholder="Price / Cost">
    <input type="text" id="tags" placeholder="Tags (comma-separated)">
    <textarea id="notes" rows="2" placeholder="Personal Notes"></textarea>
    <input type="url" id="certLink" placeholder="Certificate Link">
    <button type="submit" id="submitBtn">Add / Save Course</button>
</form>

<div class="table-wrapper">
<table id="courseTable">
<thead>
<tr>
    <th>Serial</th>
    <th>Name</th>
    <th>Link</th>
    <th>Certificate</th>
    <th>Hours</th>
    <th>University</th>
    <th>Start</th>
    <th>Completion</th>
    <th>Status</th>
    <th>Progress</th>
    <th>Rating</th>
    <th>Category</th>
    <th>Instructor</th>
    <th>Price</th>
    <th>Tags</th>
    <th>Notes</th>
    <th>Cert Link</th>
    <th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div id="analytics">
    <strong>Total Courses:</strong> <span id="totalCourses">0</span> | 
    <strong>Completed:</strong> <span id="completedCourses">0</span> | 
    <strong>Average Rating:</strong> <span id="avgRating">0</span> | 
    <strong>Total Hours:</strong> <span id="totalHours">0</span>
</div>

<div style="margin-top:10px;">
    <button id="exportCSV">Export CSV</button>
    <input type="file" id="importCSV" accept=".csv">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBi3-mPivjOHd6mnPNc8ZTTZlt_TQZUiB8",
    authDomain: "trading-statistics-tracking.firebaseapp.com",
    projectId: "trading-statistics-tracking",
    storageBucket: "trading-statistics-tracking.firebasestorage.app",
    messagingSenderId: "493862544915",
    appId: "1:493862544915:web:4a8cc65efe2d7f151881e6",
    measurementId: "G-CHVF595L0E"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const coursesCollection = collection(db, "courses");

let courses = [];
let editDocId = null;

function setStatus(message) {
    document.getElementById('statusMessage').textContent = message;
}

function escapeHTML(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function safeUrl(url) {
    const value = String(url ?? '').trim();
    if (!value) return '#';
    try {
        const parsed = new URL(value);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return value;
    } catch (error) {
        return '#';
    }
    return '#';
}

async function loadCourses() {
    try {
        setStatus('Loading courses from Firebase...');
        courses = [];

        const querySnapshot = await getDocs(coursesCollection);
        querySnapshot.forEach((document) => {
            courses.push({
                id: document.id,
                ...document.data()
            });
        });

        renderTable();
        setStatus('Connected to Firebase. Data will show on any device.');
    } catch (error) {
        console.error(error);
        setStatus('Firebase loading failed. Check Firestore rules and console errors.');
    }
}

function calculateStatus(course) {
    const today = new Date();
    const start = new Date(course.startDate);
    const end = new Date(course.completeDate);

    if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return 'Upcoming';
    if (today > end) return 'Completed';
    if (today >= start && today <= end) return 'Ongoing';
    return 'Upcoming';
}

function calculateProgress(course) {
    const today = new Date();
    const start = new Date(course.startDate);
    const end = new Date(course.completeDate);

    if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return 0;
    if (today <= start) return 0;
    if (today >= end) return 100;
    return Math.round((today - start) / (end - start) * 100);
}

function renderTable() {
    const tbody = document.querySelector('#courseTable tbody');
    tbody.innerHTML = '';

    let filtered = [...courses];

    const searchVal = document.getElementById('search').value.toLowerCase().trim();
    if (searchVal) {
        filtered = filtered.filter(c =>
            String(c.name || '').toLowerCase().includes(searchVal) ||
            String(c.university || '').toLowerCase().includes(searchVal) ||
            String(c.category || '').toLowerCase().includes(searchVal)
        );
    }

    const statusFilter = document.getElementById('filterStatus').value;
    if (statusFilter) filtered = filtered.filter(c => calculateStatus(c) === statusFilter);

    const certFilter = document.getElementById('filterCertificate').value;
    if (certFilter) filtered = filtered.filter(c => c.certificate === certFilter);

    const sortBy = document.getElementById('sortBy').value;
    if (sortBy) {
        filtered.sort((a, b) => {
            if (sortBy === 'rating' || sortBy === 'hours') {
                return Number(b[sortBy] || 0) - Number(a[sortBy] || 0);
            }
            return new Date(a[sortBy]) - new Date(b[sortBy]);
        });
    }

    filtered.forEach((course) => {
        const status = calculateStatus(course);
        const progress = calculateProgress(course);
        const tr = document.createElement('tr');
        tr.className = status.toLowerCase();

        tr.innerHTML = `
            <td>${escapeHTML(course.serial)}</td>
            <td>${escapeHTML(course.name)}</td>
            <td><a href="${escapeHTML(safeUrl(course.weblink))}" target="_blank" rel="noopener">Link</a></td>
            <td>${escapeHTML(course.certificate)}</td>
            <td>${escapeHTML(course.hours)}</td>
            <td>${escapeHTML(course.university)}</td>
            <td>${escapeHTML(course.startDate)}</td>
            <td>${escapeHTML(course.completeDate)}</td>
            <td>${status}</td>
            <td><div class="progress-bar-container"><div class="progress-bar" style="width:${progress}%"></div></div> ${progress}%</td>
            <td>${escapeHTML(course.rating)}</td>
            <td>${escapeHTML(course.category)}</td>
            <td>${escapeHTML(course.instructor)}</td>
            <td>${escapeHTML(course.price)}</td>
            <td>${escapeHTML(course.tags)}</td>
            <td>${escapeHTML(course.notes)}</td>
            <td>${course.certLink ? `<a href="${escapeHTML(safeUrl(course.certLink))}" target="_blank" rel="noopener">Link</a>` : ''}</td>
            <td>
                <button class="action-btn edit-btn" onclick="editCourse('${course.id}')">Edit</button>
                <button class="action-btn delete-btn" onclick="deleteCourse('${course.id}')">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    const totalCourses = courses.length;
    const completedCourses = courses.filter(c => calculateStatus(c) === 'Completed').length;
    const avgRating = totalCourses ? (courses.reduce((sum, c) => sum + Number(c.rating || 0), 0) / totalCourses).toFixed(2) : '0.00';
    const totalHours = courses.reduce((sum, c) => sum + Number(c.hours || 0), 0);

    document.getElementById('totalCourses').textContent = totalCourses;
    document.getElementById('completedCourses').textContent = completedCourses;
    document.getElementById('avgRating').textContent = avgRating;
    document.getElementById('totalHours').textContent = totalHours;
}

window.editCourse = function(courseId) {
    const c = courses.find(course => course.id === courseId);
    if (!c) return;

    editDocId = courseId;

    for (const key in c) {
        if (document.getElementById(key)) {
            document.getElementById(key).value = c[key] || '';
        }
    }

    document.getElementById('submitBtn').textContent = 'Update Course';
    window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.deleteCourse = async function(courseId) {
    if (!confirm('Delete this course?')) return;

    try {
        await deleteDoc(doc(db, "courses", courseId));
        await loadCourses();
    } catch (error) {
        console.error(error);
        alert('Delete failed. Check Firestore rules.');
    }
};

document.getElementById('courseForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const course = {
        serial: document.getElementById('serial').value.trim(),
        name: document.getElementById('name').value.trim(),
        weblink: document.getElementById('weblink').value.trim(),
        certificate: document.getElementById('certificate').value,
        hours: document.getElementById('hours').value,
        university: document.getElementById('university').value.trim(),
        startDate: document.getElementById('startDate').value,
        completeDate: document.getElementById('completeDate').value,
        rating: document.getElementById('rating').value,
        category: document.getElementById('category').value.trim(),
        instructor: document.getElementById('instructor').value.trim(),
        price: document.getElementById('price').value.trim(),
        tags: document.getElementById('tags').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        certLink: document.getElementById('certLink').value.trim(),
        updatedAt: new Date().toISOString()
    };

    try {
        if (editDocId) {
            await updateDoc(doc(db, "courses", editDocId), course);
            editDocId = null;
            document.getElementById('submitBtn').textContent = 'Add / Save Course';
        } else {
            course.createdAt = new Date().toISOString();
            await addDoc(coursesCollection, course);
        }

        e.target.reset();
        await loadCourses();
    } catch (error) {
        console.error(error);
        alert('Save failed. Check Firestore rules.');
    }
});

document.getElementById('search').addEventListener('input', renderTable);
document.getElementById('filterStatus').addEventListener('change', renderTable);
document.getElementById('filterCertificate').addEventListener('change', renderTable);
document.getElementById('sortBy').addEventListener('change', renderTable);

document.getElementById('darkModeToggle').addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
});

document.getElementById('exportCSV').addEventListener('click', () => {
    let csv = 'Serial,Name,Weblink,Certificate,Hours,University,StartDate,CompleteDate,Rating,Category,Instructor,Price,Tags,Notes,CertLink\n';
    courses.forEach(c => {
        csv += `"${c.serial || ''}","${c.name || ''}","${c.weblink || ''}","${c.certificate || ''}","${c.hours || ''}","${c.university || ''}","${c.startDate || ''}","${c.completeDate || ''}","${c.rating || ''}","${c.category || ''}","${c.instructor || ''}","${c.price || ''}","${c.tags || ''}","${c.notes || ''}","${c.certLink || ''}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'courses.csv';
    link.click();
});

document.getElementById('importCSV').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(event) {
        try {
            const lines = event.target.result.split('\n').slice(1);

            for (const line of lines) {
                const vals = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, ''));
                if (vals[0]) {
                    await addDoc(coursesCollection, {
                        serial: vals[0] || '',
                        name: vals[1] || '',
                        weblink: vals[2] || '',
                        certificate: vals[3] || '',
                        hours: vals[4] || '',
                        university: vals[5] || '',
                        startDate: vals[6] || '',
                        completeDate: vals[7] || '',
                        rating: vals[8] || '',
                        category: vals[9] || '',
                        instructor: vals[10] || '',
                        price: vals[11] || '',
                        tags: vals[12] || '',
                        notes: vals[13] || '',
                        certLink: vals[14] || '',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });
                }
            }

            await loadCourses();
            e.target.value = '';
        } catch (error) {
            console.error(error);
            alert('CSV import failed.');
        }
    };

    reader.readAsText(file);
});

loadCourses();
</script>

</body>
</html>
